<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visitor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; padding: 20px; min-height: 100vh; cursor: default; }
  h1 { color: #38bdf8; margin-bottom: 20px; }
  
  /* Login Screen */
  .login-box { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 16px; }
  .login-box button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
  .login-box button:hover { background: #0ea5e9; }
  
  /* Dashboard */
  .dashboard { display: none; }
  
  /* Stats Cards */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
  .stat-card { background: #1e293b; padding: 20px; border-radius: 10px; border-left: 4px solid #38bdf8; transition: transform 0.3s; }
  .stat-card:hover { transform: translateY(-3px); }
  .stat-card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .stat-card .value { font-size: 28px; font-weight: bold; color: #f1f5f9; }
  
  /* Controls */
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .controls input, .controls button { padding: 10px 14px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; }
  .controls input { flex: 1; min-width: 200px; }
  .controls button { background: #38bdf8; color: #0f172a; cursor: pointer; font-weight: bold; border: none; transition: background 0.3s; }
  .controls button:hover { background: #0ea5e9; }
  .controls button.logout { background: #ef4444; color: #fff; }
  .controls button.logout:hover { background: #dc2626; }
  
  /* Table */
  .table-wrapper { background: #1e293b; border-radius: 10px; overflow: auto; max-height: 600px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #334155; padding: 12px 10px; text-align: left; position: sticky; top: 0; color: #38bdf8; font-weight: 600; letter-spacing: 0.5px; }
  td { padding: 10px; border-bottom: 1px solid #334155; }
  tr:hover td { background: #263449; }
  
  /* Badges */
  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
  .badge-mobile { background: #10b981; color: #fff; }
  .badge-desktop { background: #3b82f6; color: #fff; }
  
  /* Charts */
  .charts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; }
  .chart-box { background: #1e293b; padding: 20px; border-radius: 10px; }
  .chart-box h3 { color: #38bdf8; margin-bottom: 15px; font-size: 16px; }
  .bar-item { margin: 8px 0; }
  .bar-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
  .bar-bg { background: #0f172a; height: 20px; border-radius: 4px; overflow: hidden; }
  .bar-fill { background: linear-gradient(90deg, #38bdf8, #0ea5e9); height: 100%; transition: width 0.5s; }
  .no-data { color: #64748b; font-size: 13px; text-align: center; padding: 20px 0; }
  
  /* Error message */
  .error { color: #ef4444; text-align: center; margin-top: 10px; font-size: 14px; }
  
  /* Location link */
  .location-link { color: #38bdf8; text-decoration: none; transition: color 0.3s; }
  .location-link:hover { color: #0ea5e9; text-decoration: underline; }
  
  /* Loading */
  .loading { text-align: center; padding: 40px; color: #64748b; }
  
  /* Responsive */
  @media (max-width: 1024px) { .charts { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 768px) { 
    .charts { grid-template-columns: 1fr; }
    body { padding: 10px; }
    .stat-card .value { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-box">
  <h1>🔒 Admin Login</h1>
  <input type="password" id="passwordInput" placeholder="Enter password...">
  <button id="loginBtn">Login</button>
  <p class="error" id="errorMsg"></p>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard">
  <h1>📊 Visitor Dashboard</h1>
  
  <!-- Stats Cards -->
  <div class="stats-grid" id="statsGrid">
    <div class="loading">Loading stats...</div>
  </div>
  
  <!-- Charts -->
  <div class="charts">
    <div class="chart-box">
      <h3>🌍 Top Countries</h3>
      <div id="countryChart"><p class="no-data">Loading...</p></div>
    </div>
    <div class="chart-box">
      <h3>🗺️ Top Regions</h3>
      <div id="regionChart"><p class="no-data">Loading...</p></div>
    </div>
    <div class="chart-box">
      <h3>📱 Device Types</h3>
      <div id="deviceChart"><p class="no-data">Loading...</p></div>
    </div>
  </div>
  
  <!-- Controls -->
  <div class="controls">
    <input type="text" id="searchInput" placeholder="🔍 Search by IP, city, country, region...">
    <button id="refreshBtn">🔄 Refresh</button>
    <button id="exportBtn">📥 Export CSV</button>
    <button id="logoutBtn" class="logout">🚪 Logout</button>
  </div>
  
  <!-- Table -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Time (IST)</th>
          <th>IP Address</th>
          <th>City</th>
          <th>Region</th>
          <th>Country</th>
          <th>Location</th>
          <th>Device</th>
          <th>Screen</th>
          <th>Page</th>
          <th>Time Spent</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="11" class="loading">Loading data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // ⚠️ CHANGE THESE THREE VALUES TO YOUR OWN
  const ADMIN_PASSWORD = "2558";
  const SUPABASE_URL = "https://skmjiejwtdsiqzjqyspq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Vzv5w63zsA6YylWNyQA82Q_H5XKKW77";
  
  let supabaseClient;
  let allData = [];

  // Initialize Supabase
  try {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    console.log("✅ Supabase initialized");
  } catch (e) {
    console.error("❌ Supabase init failed:", e);
  }

  // ============ AUTH ============
  function login() {
    console.log("Login attempted");
    const pass = document.getElementById('passwordInput').value;
    if (pass === ADMIN_PASSWORD) {
      console.log("✅ Login successful");
      sessionStorage.setItem('adminAuth', 'true');
      showDashboard();
    } else {
      console.log("❌ Wrong password");
      document.getElementById('errorMsg').textContent = "Wrong password! Try again.";
    }
  }

  function logout() {
    sessionStorage.removeItem('adminAuth');
    location.reload();
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  }

  // ============ DATA LOADING ============
  async function loadData() {
    try {
      const { data, error } = await supabaseClient
        .from('visitors')
        .select('*')
        .order('id', { ascending: false });
      
      if (error) {
        alert("Error loading data: " + error.message);
        console.error(error);
        return;
      }
      
      allData = data || [];
      console.log("✅ Loaded", allData.length, "visitors");
      renderStats(allData);
      renderCharts(allData);
      renderTable(allData);
    } catch (e) {
      alert("Error: " + e.message);
      console.error(e);
    }
  }

  // ============ STATS ============
  function renderStats(data) {
    const totalVisits = data.length;
    const uniqueIPs = new Set(data.map(v => v.ip)).size;
    const avgTime = data.length ? Math.round(data.reduce((s, v) => s + (v.time_spent || 0), 0) / data.length) : 0;
    const countries = new Set(data.map(v => v.country).filter(c => c && c !== 'Unknown')).size;
    const mobileCount = data.filter(v => /Mobile|Android|iPhone/i.test(v.device || '')).length;
    const mobilePct = data.length ? Math.round((mobileCount / data.length) * 100) : 0;
    
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><h3>Total Visits</h3><div class="value">${totalVisits}</div></div>
      <div class="stat-card"><h3>Unique Visitors</h3><div class="value">${uniqueIPs}</div></div>
      <div class="stat-card"><h3>Avg Time (sec)</h3><div class="value">${avgTime}s</div></div>
      <div class="stat-card"><h3>Countries</h3><div class="value">${countries}</div></div>
      <div class="stat-card"><h3>📱 Mobile</h3><div class="value">${mobilePct}%</div></div>
    `;
  }

  // ============ CHARTS ============
  function renderCharts(data) {
    // Country chart
    const countryCount = {};
    data.forEach(v => {
      const c = v.country || 'Unknown';
      if (c !== 'Unknown') countryCount[c] = (countryCount[c] || 0) + 1;
    });
    const topCountries = Object.entries(countryCount).sort((a,b) => b[1]-a[1]).slice(0, 5);
    renderBarChart('countryChart', topCountries);

    // Region chart
    const regionCount = {};
    data.forEach(v => {
      const r = v.region || 'Unknown';
      if (r !== 'Unknown') regionCount[r] = (regionCount[r] || 0) + 1;
    });
    const topRegions = Object.entries(regionCount).sort((a,b) => b[1]-a[1]).slice(0, 5);
    renderBarChart('regionChart', topRegions);

    // Device chart
    const mobile = data.filter(v => /Mobile|Android|iPhone/i.test(v.device || '')).length;
    const desktop = data.length - mobile;
    const total = data.length || 1;
    document.getElementById('deviceChart').innerHTML = total === 0 ? '<p class="no-data">No data yet</p>' : `
      <div class="bar-item">
        <div class="bar-label"><span>📱 Mobile</span><span>${mobile} (${Math.round(mobile/total*100)}%)</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(mobile/total)*100}%"></div></div>
      </div>
      <div class="bar-item">
        <div class="bar-label"><span>💻 Desktop</span><span>${desktop} (${Math.round(desktop/total*100)}%)</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(desktop/total)*100}%"></div></div>
      </div>
    `;
  }

  function renderBarChart(elementId, items) {
    if (items.length === 0) {
      document.getElementById(elementId).innerHTML = '<p class="no-data">No data yet</p>';
      return;
    }
    const maxVal = Math.max(...items.map(i => i[1]), 1);
    document.getElementById(elementId).innerHTML = items.map(([name, val]) => `
      <div class="bar-item">
        <div class="bar-label"><span>${name}</span><span>${val}</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(val/maxVal)*100}%"></div></div>
      </div>
    `).join('');
  }

  // ============ TABLE ============
  function renderTable(data) {
    if (data.length === 0) {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" class="loading">No visitors yet</td></tr>';
      return;
    }
    
    document.getElementById('tableBody').innerHTML = data.map((v, index) => {
      const isMobile = /Mobile|Android|iPhone/i.test(v.device || '');
      const browser = (v.device || '').match(/(Chrome|Firefox|Safari|Edge)/)?.[0] || 'Unknown';
      
      // Google Maps link for location
      let locationCell = '-';
      if (v.lat_lon && v.lat_lon !== '0, 0' && v.lat_lon !== 'null, null' && !v.lat_lon.includes('0, 0')) {
        const coords = v.lat_lon.replace(/\s/g, '');
        locationCell = `<a href="https://www.google.com/maps?q=${coords}" target="_blank" class="location-link" title="Open in Google Maps">📍 ${v.lat_lon}</a>`;
      }
      
      return `
        <tr>
          <td>${index + 1}</td>
          <td>${v.visit_time_ist || v.created_at || '-'}</td>
          <td>${v.ip || '-'}</td>
          <td>${v.city || '-'}</td>
          <td>${v.region || '-'}</td>
          <td>${v.country || '-'}</td>
          <td>${locationCell}</td>
          <td><span class="badge ${isMobile ? 'badge-mobile' : 'badge-desktop'}">${isMobile ? '📱' : '💻'} ${browser}</span></td>
          <td>${v.screen_res || '-'}</td>
          <td>${(v.page_url || '').replace('https://', '').substring(0, 30)}</td>
          <td>${v.time_spent || 0}s</td>
        </tr>
      `;
    }).join('');
  }

  // ============ SEARCH ============
  function filterData() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allData.filter(v => JSON.stringify(v).toLowerCase().includes(q));
    renderTable(filtered);
  }

  // ============ EXPORT CSV ============
  function exportCSV() {
    if (allData.length === 0) {
      alert("No data to export!");
      return;
    }
    
    const headers = ['#','Time (IST)','IP','City','Region','Country','Lat/Lon','Device','Screen','Page','Time Spent (s)'];
    const rows = allData.map((v, i) => [
      i + 1,
      `"${v.visit_time_ist || v.created_at || '-'}"`,
      v.ip || '-',
      `"${v.city || '-'}"`,
      `"${v.region || '-'}"`,
      `"${v.country || '-'}"`,
      `"${v.lat_lon || '-'}"`,
      `"${(v.device||'').replace(/"/g,'""')}"`,
      v.screen_res || '-',
      `"${v.page_url || '-'}"`,
      v.time_spent || 0
    ].join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `visitors_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  // ============ EVENT LISTENERS ============
  document.addEventListener('DOMContentLoaded', () => {
    console.log("✅ DOM loaded, attaching events");
    
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('passwordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('searchInput').addEventListener('input', filterData);
    
    // Auto-login if session exists
    if (sessionStorage.getItem('adminAuth') === 'true') {
      showDashboard();
    }
  });
</script>

</body>
</html>
