<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visitor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; padding: 20px; min-height: 100vh; }
  h1 { color: #38bdf8; margin-bottom: 20px; }
  .login-box { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 16px; }
  .login-box button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .login-box button:hover { background: #0ea5e9; }
  .dashboard { display: none; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
  .stat-card { background: #1e293b; padding: 20px; border-radius: 10px; border-left: 4px solid #38bdf8; }
  .stat-card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
  .stat-card .value { font-size: 28px; font-weight: bold; color: #f1f5f9; }
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .controls input, .controls select, .controls button { padding: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; }
  .controls button { background: #38bdf8; color: #0f172a; cursor: pointer; font-weight: bold; border: none; }
  .controls button:hover { background: #0ea5e9; }
  .table-wrapper { background: #1e293b; border-radius: 10px; overflow: auto; max-height: 600px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #334155; padding: 12px 10px; text-align: left; position: sticky; top: 0; color: #38bdf8; }
  td { padding: 10px; border-bottom: 1px solid #334155; }
  tr:hover td { background: #263449; }
  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .badge-mobile { background: #10b981; color: #fff; }
  .badge-desktop { background: #3b82f6; color: #fff; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
  .chart-box { background: #1e293b; padding: 20px; border-radius: 10px; }
  .chart-box h3 { color: #38bdf8; margin-bottom: 15px; font-size: 16px; }
  .bar-item { margin: 8px 0; }
  .bar-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
  .bar-bg { background: #0f172a; height: 20px; border-radius: 4px; overflow: hidden; }
  .bar-fill { background: linear-gradient(90deg, #38bdf8, #0ea5e9); height: 100%; transition: width 0.5s; }
  .error { color: #ef4444; text-align: center; margin-top: 10px; }
  @media (max-width: 768px) { .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-box">
  <h1>🔒 Admin Login</h1>
  <input type="password" id="passwordInput" placeholder="Enter password...">
  <button onclick="login()">Login</button>
  <p class="error" id="errorMsg"></p>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard">
  <h1>📊 Visitor Dashboard</h1>
  
  <div class="stats-grid" id="statsGrid"></div>
  
  <div class="charts">
    <div class="chart-box">
      <h3>🌍 Top Countries</h3>
      <div id="countryChart"></div>
    </div>
    <div class="chart-box">
      <h3>📱 Device Types</h3>
      <div id="deviceChart"></div>
    </div>
  </div>
  
  <div class="controls">
    <input type="text" id="searchInput" placeholder="🔍 Search IP, city, country..." oninput="filterData()">
    <button onclick="loadData()">🔄 Refresh</button>
    <button onclick="exportCSV()">📥 Export CSV</button>
  </div>
  
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Time (IST)</th>
          <th>IP</th>
          <th>City</th>
          <th>Country</th>
          <th>Device</th>
          <th>Screen</th>
          <th>Page</th>
          <th>Time Spent</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // ⚠️ CHANGE THIS PASSWORD to something only you know!
  const ADMIN_PASSWORD = "2558";
  
  // ⚠️ REPLACE with YOUR Supabase details
  const SUPABASE_URL = "https://skmjiejwtdsiqzjqyspq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Vzv5w63zsA6YylWNyQA82Q_H5XKKW77";
  
  let allData = [];

  function login() {
    const pass = document.getElementById('passwordInput').value;
    if (pass === ADMIN_PASSWORD) {
      sessionStorage.setItem('adminAuth', 'true');
      showDashboard();
    } else {
      document.getElementById('errorMsg').textContent = "Wrong password!";
    }
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  }

  async function loadData() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/visitors?select=*&order=id.desc`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      allData = await res.json();
      renderStats(allData);
      renderCharts(allData);
      renderTable(allData);
    } catch (e) {
      alert("Error loading data: " + e.message);
    }
  }

  function renderStats(data) {
    const totalVisits = data.length;
    const uniqueIPs = new Set(data.map(v => v.ip)).size;
    const avgTime = data.length ? Math.round(data.reduce((s, v) => s + (v.time_spent || 0), 0) / data.length) : 0;
    const countries = new Set(data.map(v => v.country).filter(c => c && c !== 'Unknown')).size;

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><h3>Total Visits</h3><div class="value">${totalVisits}</div></div>
      <div class="stat-card"><h3>Unique Visitors</h3><div class="value">${uniqueIPs}</div></div>
      <div class="stat-card"><h3>Avg Time (sec)</h3><div class="value">${avgTime}</div></div>
      <div class="stat-card"><h3>Countries</h3><div class="value">${countries}</div></div>
    `;
  }

  function renderCharts(data) {
    // Country chart
    const countryCount = {};
    data.forEach(v => {
      const c = v.country || 'Unknown';
      countryCount[c] = (countryCount[c] || 0) + 1;
    });
    const topCountries = Object.entries(countryCount).sort((a,b) => b[1]-a[1]).slice(0, 5);
    const maxC = Math.max(...topCountries.map(c => c[1]), 1);
    document.getElementById('countryChart').innerHTML = topCountries.map(([name, val]) => `
      <div class="bar-item">
        <div class="bar-label"><span>${name}</span><span>${val}</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(val/maxC)*100}%"></div></div>
      </div>
    `).join('');

    // Device chart
    const mobile = data.filter(v => /Mobile|Android|iPhone/i.test(v.device || '')).length;
    const desktop = data.length - mobile;
    const total = data.length || 1;
    document.getElementById('deviceChart').innerHTML = `
      <div class="bar-item">
        <div class="bar-label"><span>📱 Mobile</span><span>${mobile} (${Math.round(mobile/total*100)}%)</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(mobile/total)*100}%"></div></div>
      </div>
      <div class="bar-item">
        <div class="bar-label"><span>💻 Desktop</span><span>${desktop} (${Math.round(desktop/total*100)}%)</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(desktop/total)*100}%"></div></div>
      </div>
    `;
  }

  function renderTable(data) {
    document.getElementById('tableBody').innerHTML = data.map((v, index) => {
      const isMobile = /Mobile|Android|iPhone/i.test(v.device || '');
      const browser = (v.device || '').match(/(Chrome|Firefox|Safari|Edge)/)?.[0] || 'Unknown';
      return `
        <tr>
          <td>${index + 1}</td>
          <td>${v.visit_time_ist || v.created_at || '-'}</td>
          <td>${v.ip || '-'}</td>
          <td>${v.city || '-'}</td>
          <td>${v.country || '-'}</td>
          <td><span class="badge ${isMobile ? 'badge-mobile' : 'badge-desktop'}">${isMobile ? '📱' : '💻'} ${browser}</span></td>
          <td>${v.screen_res || '-'}</td>
          <td>${(v.page_url || '').replace('https://', '').substring(0, 30)}</td>
          <td>${v.time_spent || 0}s</td>
        </tr>
      `;
    }).join('');
  }

  function filterData() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allData.filter(v => 
      JSON.stringify(v).toLowerCase().includes(q)
    );
    renderTable(filtered);
  }

  function exportCSV() {
    const headers = ['ID','Time','IP','City','Country','Device','Screen','Page','Time Spent'];
    const rows = allData.map(v => [
      v.id, v.visit_time_ist, v.ip, v.city, v.country, 
      `"${v.device}"`, v.screen_res, v.page_url, v.time_spent
    ].join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `visitors_${Date.now()}.csv`;
    link.click();
  }

  // Auto-login if session exists
  if (sessionStorage.getItem('adminAuth') === 'true') {
    showDashboard();
  }

  // Enter key login
  document.getElementById('passwordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
  });
</script>

</body>
</html>
